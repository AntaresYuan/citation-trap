<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citation Trap — trace viewer</title>
<style>
  :root {
    --faithful:#1a7f37; --misattributed:#bf8700; --fabricated:#cf222e;
    --unsupported:#8250df; --bg:#0d1117; --panel:#161b22; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--text); }
  header { padding:18px 24px; border-bottom:1px solid var(--border); }
  h1 { margin:0; font-size:18px; }
  .sub { color:var(--muted); font-size:13px; margin-top:4px; }
  .wrap { display:flex; gap:0; height:calc(100vh - 70px); }
  .left { width:340px; border-right:1px solid var(--border); overflow:auto; flex:none; }
  .right { flex:1; overflow:auto; padding:24px; }

  /* 2x2 */
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:16px; }
  .cell { background:var(--panel); border:1px solid var(--border); border-radius:8px;
          padding:12px; text-align:center; }
  .cell .n { font-size:26px; font-weight:700; }
  .cell .lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .cell.headline { border-color:var(--fabricated); }
  .cell.headline .n { color:var(--fabricated); }
  .stats { padding:0 16px 8px; color:var(--muted); font-size:12px; }

  .qitem { padding:10px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
  .qitem:hover { background:var(--panel); }
  .qitem.active { background:#1f2937; }
  .qitem .qid { font-weight:600; }
  .badge { display:inline-block; font-size:10px; padding:1px 7px; border-radius:10px;
           color:#fff; vertical-align:middle; }
  .b-ideal { background:var(--faithful); }
  .b-correct_but_fabricated { background:var(--fabricated); }
  .b-honest_wrong { background:var(--misattributed); }
  .b-worst { background:#6e7681; }

  .claim { background:var(--panel); border:1px solid var(--border); border-left-width:4px;
           border-radius:6px; padding:10px 12px; margin:8px 0; }
  .claim.faithful { border-left-color:var(--faithful); }
  .claim.misattributed { border-left-color:var(--misattributed); }
  .claim.fabricated { border-left-color:var(--fabricated); }
  .claim.unsupported { border-left-color:var(--unsupported); }
  .tag { font-size:10px; font-weight:700; text-transform:uppercase; padding:1px 6px;
         border-radius:4px; color:#fff; }
  .tag.faithful { background:var(--faithful); }
  .tag.misattributed { background:var(--misattributed); }
  .tag.fabricated { background:var(--fabricated); }
  .tag.unsupported { background:var(--unsupported); }
  .pid { font-family:ui-monospace,monospace; font-size:12px; color:var(--muted); }
  .passage { margin-top:6px; font-size:13px; color:var(--text); }
  .passage.missing { color:var(--fabricated); font-style:italic; }
  .qtext { font-size:16px; font-weight:600; margin-bottom:4px; }
  .answer { background:var(--panel); border:1px solid var(--border); border-radius:6px;
            padding:10px 12px; margin:10px 0; }
  .ok { color:var(--faithful); } .no { color:var(--fabricated); }
  .steps { color:var(--muted); font-size:12px; margin-top:16px; }
  .empty { padding:40px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Citation Trap <span class="sub" id="agent"></span></h1>
  <div class="sub">Primary score: citation faithfulness · Secondary: answer correctness</div>
</header>

<div class="wrap">
  <div class="left">
    <div class="grid2" id="grid2"></div>
    <div class="stats" id="stats"></div>
    <div id="qlist"></div>
  </div>
  <div class="right" id="detail"><div class="empty">Select a question on the left.</div></div>
</div>

<script src="data.js"></script>
<script>
const D = window.CITATION_TRAP;
const QUADS = [
  ["ideal","answer right · sources trustworthy"],
  ["correct_but_fabricated","answer right · sources fabricated"],
  ["honest_wrong","answer wrong · sources trustworthy"],
  ["worst","answer wrong · sources fabricated"],
];

function renderSummary() {
  const s = D.summary;
  document.getElementById("agent").textContent = "· agent: " + s.agent;
  document.getElementById("grid2").innerHTML = QUADS.map(([k,desc]) => `
    <div class="cell ${k==='correct_but_fabricated'?'headline':''}">
      <div class="n">${s.quadrants[k]||0}</div>
      <div class="lbl">${k.replace(/_/g,' ')}</div>
    </div>`).join("");
  document.getElementById("stats").innerHTML =
    `${s.n} episodes · accuracy <b>${(s.accuracy*100).toFixed(0)}%</b> · ` +
    `mean faithfulness <b>${(s.mean_faithfulness*100).toFixed(0)}%</b>`;
}

function renderList() {
  document.getElementById("qlist").innerHTML = D.traces.map((t,i) => `
    <div class="qitem" data-i="${i}">
      <span class="qid">${t.qid}</span>
      <span class="badge b-${t.score.quadrant}">${t.score.quadrant.replace(/_/g,' ')}</span>
      <div class="sub">em ${t.score.em} · faith ${(t.score.faithfulness_score*100).toFixed(0)}%</div>
    </div>`).join("");
  document.querySelectorAll(".qitem").forEach(el =>
    el.onclick = () => select(+el.dataset.i));
}

function select(i) {
  document.querySelectorAll(".qitem").forEach((el,j) =>
    el.classList.toggle("active", j===i));
  const t = D.traces[i], s = t.score;
  const claims = s.citations.map(c => {
    const txt = D.corpus[c.passage_id];
    const body = txt
      ? `<div class="passage">${txt}</div>`
      : `<div class="passage missing">⚠ passage id not in corpus — fabricated citation</div>`;
    return `<div class="claim ${c.label}">
        <span class="tag ${c.label}">${c.label}</span>
        <span class="pid">${c.passage_id}</span>
        <div style="margin-top:6px">${c.claim||"<i>(no claim text)</i>"}</div>
        ${body}
      </div>`;
  }).join("") || "<div class='sub'>No citations.</div>";

  document.getElementById("detail").innerHTML = `
    <div class="qtext">${t.question}</div>
    <span class="badge b-${s.quadrant}">${s.quadrant.replace(/_/g,' ')}</span>
    <div class="answer">
      <b>Answer:</b> ${s.answer || "<i>(empty)</i>"}
      <span class="${s.answer_correct?'ok':'no'}">${s.answer_correct?'✓ matches gold':'✗ gold: '+s.gold_answer}</span>
      <div class="sub">EM ${s.em} · F1 ${s.f1} · faithfulness ${(s.faithfulness_score*100).toFixed(0)}%</div>
    </div>
    <h3>Citations</h3>
    ${claims}
    <div class="steps">Steps: ${t.steps.map(st =>
       st.action==='search' ? `search("${st.query}")` : 'submit').join(" → ")}</div>`;
}

renderSummary(); renderList();
const firstTrap = D.traces.findIndex(t => t.score.quadrant==="correct_but_fabricated");
select(firstTrap >= 0 ? firstTrap : 0);
</script>
</body>
</html>
